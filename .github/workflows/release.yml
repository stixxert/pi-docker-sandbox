name: Release

# Trigger: any push to main, or manual "Run workflow" from the Actions tab.
# semantic-release decides whether a release actually happens: it analyzes
# commits since the last release tag and only publishes when there is at
# least one releasable commit (fix -> patch, feat -> minor, BREAKING CHANGE
# -> major). Pushes with no releasable commits exit 0 without publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN is read-only by default; semantic-release needs write access
# to push the release tag and create the GitHub Release, plus issues: write
# to file a failure-notification issue when a release run fails.
# id-token: write lets GitHub mint a short-lived OIDC token that npm verifies
# against the package's trusted publisher config — no NPM_TOKEN secret needed.
permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: commit analysis needs every commit since the last
          # release tag, which a shallow (depth 1) checkout would miss.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Do NOT set registry-url here: setup-node would write an .npmrc
          # that can interfere with OIDC-based trusted publishing.

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Trusted publishing requires npm >= 11.5.1. Node 24 bundles npm 11.x,
      # but pin to latest so the requirement holds regardless of the exact
      # Node patch version setup-node installs.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      # semantic-release computes the version, bumps package.json, and creates
      # the git tag + GitHub Release. @semantic-release/npm runs with
      # npmPublish: false (see .releaserc), so the actual npm publish is done
      # by the explicit step below and is visible in this workflow. The
      # "released" flag is set when a new version tag was created this run.
      - name: Release
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          npx semantic-release
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          if [ "$before" != "$after" ]; then
            echo "released=yes" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npm publish via OIDC trusted publishing. npm CLI >= 11.5.1 (updated
      # above) automatically detects the GitHub Actions OIDC token granted by
      # the id-token: write permission and exchanges it against the package's
      # trusted publisher on npmjs.com — no NPM_TOKEN secret, and a provenance
      # attestation is attached automatically. Only runs when semantic-release
      # actually produced a release in this run.
      - name: Publish to npm (OIDC trusted publishing)
        if: env.released == 'yes'
        run: |
          echo "Publishing $(git describe --tags --abbrev=0) to npm via trusted publishing"
          npm publish
